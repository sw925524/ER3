    async function fetchWeather(lat, lon, dateStr) {
      const cacheKey = `${lat},${lon},${dateStr}`;
      if (weatherCache[cacheKey]) return weatherCache[cacheKey];

      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto`);
        const data = await res.json();
        
        if (data && data.daily) {
          const idx = data.daily.time.indexOf(dateStr);
          const targetIdx = idx !== -1 ? idx : 0;
          const maxTemp = Math.round(data.daily.temperature_2m_max[targetIdx]);
          const minTemp = Math.round(data.daily.temperature_2m_min[targetIdx]);
          const code = data.daily.weathercode[targetIdx];

          const result = { minTemp, maxTemp, icon: getWeatherIcon(code) };
          weatherCache[cacheKey] = result;
          return result;
        }
      } catch (e) {
        console.warn("Weather API fetch error", e);
      }
      return { minTemp: 3, maxTemp: 11, icon: "cloud" };
    }

    function getWeatherIcon(code) {
      if (code === 0) return "sun";
      if (code >= 1 && code <= 3) return "cloud-sun";
      if (code >= 45 && code <= 48) return "cloud-fog";
      if (code >= 51 && code <= 67) return "cloud-rain";
      if (code >= 71) return "snowflake";
      return "cloud";
    }

    function getExpenses() {
      return JSON.parse(localStorage.getItem('nordic_expenses') || '[]');

      localStorage.setItem('nordic_expenses', JSON.stringify(expenses));
    }

    function renderExpenses() {
      const expenses = getExpenses();
      const list = document.getElementById('expense-list');
      const totalTwdEl = document.getElementById('total-expense-twd');

      let totalEUR = 0;

      if (expenses.length === 0) {
        list.innerHTML = `<p class="text-center text-xs text-muji-muted py-4">目前尚無消費記錄</p>`;
        totalTwdEl.textContent = `NT$ 0`;
        return;
      }

      list.innerHTML = expenses.map((item, idx) => {
        const eur = parseFloat(item.amount);
        const twd = Math.round(eur * EUR_RATE);
        totalEUR += eur;

        return `
          <div class="flex justify-between items-center bg-muji-bg p-2.5 rounded-lg border border-muji-border text-xs">
            <div class="space-y-0.5">
              <div class="flex items-center gap-1.5">
                <span class="font-medium text-muji-dark">${item.note || item.category}</span>
                <span class="text-[10px] px-1.5 py-0.2 bg-muji-card border border-muji-border rounded text-muji-muted">${item.category}</span>
                <span class="text-[10px] text-muji-accent">${item.payment}</span>
              </div>
              <div class="text-[10px] text-muji-muted">${item.date}</div>
            </div>
            <div class="text-right flex items-center gap-2">
              <div>
                <div class="font-semibold text-muji-dark">€${eur.toFixed(2)}</div>
                <div class="text-[10px] text-muji-muted">NT$ ${twd.toLocaleString()}</div>
              </div>
              <button onclick="deleteExpense(${idx})" class="text-muji-muted hover:text-red-500 p-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      const totalTWD = Math.round(totalEUR * EUR_RATE);
      totalTwdEl.textContent = `NT$ ${totalTWD.toLocaleString()} (€${totalEUR.toFixed(2)})`;
      lucide.createIcons();
    }

    function deleteExpense(index) {
      const expenses = getExpenses();
      expenses.splice(index, 1);
      saveExpenses(expenses);

    document.getElementById('expense-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('exp-date').value || new Date().toISOString().split('T')[0];
      const category = document.getElementById('exp-category').value;
      const amount = document.getElementById('exp-amount').value;
      const payment = document.getElementById('exp-payment').value;
      const note = document.getElementById('exp-note').value;

      const newExpense = { date, category, amount, payment, note };
      const expenses = getExpenses();
      expenses.unshift(newExpense);
      saveExpenses(expenses);

      document.getElementById('exp-amount').value = '';
      document.getElementById('exp-note').value = '';
      document.getElementById('exp-twd-preview').textContent = 'NT$ 0';

      renderExpenses();
    });

    });

    function switchTab(tabName) {
      const tabs = ['itinerary', 'flights', 'hotels', 'accounting'];
      tabs.forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const navBtn = document.getElementById(`nav-${t}`);
        navBtn.classList.remove('text-muji-accent');
        navBtn.classList.add('text-muji-muted');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabName}`);
      activeNav.classList.add('text-muji-accent');
      activeNav.classList.remove('text-muji-muted');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('exp-date').value = "2026-09-24";
      renderDateSlider();
      renderItineraryDetail();
      renderFlights();
      renderHotels();
      renderExpenses();
      lucide.createIcons();
    });
  </script>
</body>
</html>
