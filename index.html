<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Okinawa 2026</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/826/826070.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/826/826070.png">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        [v-cloak] { display: none; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; padding-bottom: 90px; }
        .header-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1559128010-7c1ad6e1b6a5?q=80&w=1000');
            background-size: cover; background-position: center; height: 90px;
            display: flex; justify-content: center; align-items: center; color: white;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }
        .boarding-pass { background: white; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        .boarding-pass::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: repeating-linear-gradient(45deg, #f87171, #f87171 10px, white 10px, white 20px); }
        .pass-font { font-family: 'VT323', monospace; text-transform: uppercase; }
        .sticky-subtabs { position: sticky; top: 0; z-index: 50; background: #f8fafce6; backdrop-filter: blur(8px); padding: 12px 0; }
        .card { background: white; border-radius: 20px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); margin-bottom: 12px; border: 1px solid transparent; }
        .card:active { background-color: #f0f9ff; border-color: #bae6fd; }
        .map-tag { font-size: 10px; font-weight: 900; color: #0369a1; background: #e0f2fe; padding: 2px 10px; border-radius: 99px; margin-top: 8px; display: inline-block; }
        .souvenir-img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; background: #eee; }
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; height: 75px; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); z-index: 100; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-size: 11px; font-weight: bold; }
        .tab-item.active { color: #0369a1; }
    </style>
</head>
<body>
    </body>
</html>
